name: CI Quality Gates

on:
  push:
    branches: [main, "ci/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Formatting Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Format Check (zig fmt)
        run: zig fmt --check spikes/*.zig tools/*.zig build.zig src/*.zig src/*/*.zig

      - name: TigerStyle Static Analysis Linter
        run: zig run tools/lint.zig

  cross-compile-tiers:
    name: Consolidated Tier Cross-Compilation & Isolation Fences
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Tier 1 Desktop Cross-Compilation Check
        run: |
          for target in aarch64-macos x86_64-macos x86_64-linux-gnu x86_64-linux-musl aarch64-linux-gnu aarch64-linux-musl; do
            echo "Cross-compiling spike for ${target}..."
            zig build-obj spikes/resize_1cycle.zig -target ${target} -O ReleaseSmall
          done

      - name: Tier 2 Windows Cross-Compilation & Freestanding Fence
        run: |
          echo "Cross-compiling spike for x86_64-windows-gnu..."
          zig build-obj spikes/resize_1cycle.zig -target x86_64-windows-gnu -O ReleaseSmall
          zig test src/root.zig -target x86_64-windows-gnu --test-no-exec

      - name: Tier 3 Mobile Cross-Compilation Check
        run: |
          for target in aarch64-linux-android aarch64-ios aarch64-ios-simulator; do
            echo "Cross-compiling spike for ${target}..."
            zig build-obj spikes/resize_1cycle.zig -target ${target} -O ReleaseSmall
          done

      - name: Tier 4 BSD Cross-Compilation Check
        run: |
          for target in x86_64-freebsd aarch64-freebsd; do
            echo "Cross-compiling spike for ${target}..."
            zig build-obj spikes/resize_1cycle.zig -target ${target} -O ReleaseSmall
          done

      - name: Tier 5 Web & Freestanding Isolation Fence
        run: |
          for target in wasm32-freestanding wasm32-wasi; do
            echo "Cross-compiling spike for ${target}..."
            zig build-obj spikes/resize_1cycle.zig -target ${target} -O ReleaseSmall
          done
          echo "Validating root module under wasm32-freestanding..."
          zig build-obj src/root.zig -target wasm32-freestanding -O ReleaseSmall

  size-budget:
    name: Binary Size Budget Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Verify Linux musl Size Budget (<= 15,360 bytes)
        run: |
          zig build-exe spikes/engine_m0.zig -target x86_64-linux-musl -O ReleaseSmall -fstrip -femit-bin=engine_musl
          SIZE=$(stat -c%s engine_musl)
          echo "Stripped musl binary size: ${SIZE} bytes (limit: 15360 bytes)"
          if [ "${SIZE}" -gt 15360 ]; then
            echo "ERROR: Musl binary size ${SIZE} exceeds 15,360 bytes budget!"
            exit 1
          fi

      - name: Verify Mach-O Size Budget (<= 52,000 bytes)
        run: |
          zig build-exe spikes/engine_m0.zig -target aarch64-macos -O ReleaseSmall -fstrip -femit-bin=engine_macho
          SIZE=$(stat -c%s engine_macho)
          echo "Stripped Mach-O binary size: ${SIZE} bytes (limit: 52000 bytes)"
          if [ "${SIZE}" -gt 52000 ]; then
            echo "ERROR: Mach-O binary size ${SIZE} exceeds 52,000 bytes budget!"
            exit 1
          fi

  test-and-bench-linux:
    name: Test & Bench (Linux x86_64 Native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install System Fonts for TrueType Benchmark
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Run Test Suites & Oracles
        run: zig build test -Doptimize=ReleaseFast

      - name: Run Adversarial Newton Fuzzer
        run: zig test spikes/test_fuzz_newton.zig -O ReleaseFast

      - name: Run Autopsy Glyph Delta-1 Oracle
        run: zig test spikes/autopsy_glyph_delta1.zig -O ReleaseFast

      - name: Run Flagship Performance Benchmarks (ReleaseFast)
        run: zig build bench -Doptimize=ReleaseFast

  test-and-bench-macos-ios:
    name: Test & Bench (macOS ARM64, Rosetta 2 & iOS Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Run Native ARM64 Test Suites
        run: zig build test -Doptimize=ReleaseFast

      - name: Run Native Newton Fuzzer
        run: zig test spikes/test_fuzz_newton.zig -O ReleaseFast

      - name: Run Native Glyph Delta-1 Autopsy
        run: zig test spikes/autopsy_glyph_delta1.zig -O ReleaseFast

      - name: Run Native Flagship Benchmarks (ReleaseFast)
        run: zig build bench -Doptimize=ReleaseFast

      - name: Rosetta 2 Emulated Cross-Execution (Tests & Flagship Benchmarks)
        run: |
          zig test spikes/paint_pipeline.zig -target x86_64-macos -O ReleaseFast --test-no-exec -femit-bin=paint_x86
          arch -x86_64 ./paint_x86
          zig build-exe spikes/resize_1cycle.zig -target x86_64-macos -O ReleaseFast -femit-bin=resize_x86
          arch -x86_64 ./resize_x86
          zig build-exe spikes/perf_100x_prototype.zig -target x86_64-macos -O ReleaseFast -femit-bin=perf_x86
          arch -x86_64 ./perf_x86
          zig build-exe spikes/alt_architectures_bench.zig -target x86_64-macos -O ReleaseFast -femit-bin=alt_x86
          arch -x86_64 ./alt_x86
          zig build-exe spikes/truetype_real.zig -target x86_64-macos -O ReleaseFast -femit-bin=truetype_x86
          arch -x86_64 ./truetype_x86
          rm ./paint_x86 ./resize_x86 ./perf_x86 ./alt_x86 ./truetype_x86

      - name: iOS Simulator Cross-Execution (Tests & Flagship Benchmarks via xcrun simctl)
        run: |
          zig test spikes/paint_pipeline.zig -target aarch64-ios-simulator -O ReleaseFast --test-no-exec -femit-bin=paint_ios_sim
          zig build-exe spikes/resize_1cycle.zig -target aarch64-ios-simulator -O ReleaseFast -femit-bin=resize_ios_sim
          zig build-exe spikes/perf_100x_prototype.zig -target aarch64-ios-simulator -O ReleaseFast -femit-bin=perf_ios_sim
          zig build-exe spikes/alt_architectures_bench.zig -target aarch64-ios-simulator -O ReleaseFast -femit-bin=alt_ios_sim
          zig build-exe spikes/truetype_real.zig -target aarch64-ios-simulator -O ReleaseFast -femit-bin=truetype_ios_sim
          DEVICE_UUID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Booting iOS Simulator UUID: ${DEVICE_UUID}"
          xcrun simctl boot "${DEVICE_UUID}" || true
          xcrun simctl spawn "${DEVICE_UUID}" ./paint_ios_sim
          xcrun simctl spawn "${DEVICE_UUID}" ./resize_ios_sim
          xcrun simctl spawn "${DEVICE_UUID}" ./perf_ios_sim
          xcrun simctl spawn "${DEVICE_UUID}" ./alt_ios_sim
          xcrun simctl spawn "${DEVICE_UUID}" ./truetype_ios_sim
          xcrun simctl shutdown "${DEVICE_UUID}" || true
          rm ./paint_ios_sim ./resize_ios_sim ./perf_ios_sim ./alt_ios_sim ./truetype_ios_sim

  test-and-bench-windows:
    name: Test & Bench (Windows x86_64 Native)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Run Windows Native Test Suites
        run: zig build test -Doptimize=ReleaseFast

      - name: Run Windows Native Newton Fuzzer
        run: zig test spikes/test_fuzz_newton.zig -O ReleaseFast

      - name: Run Windows Native Autopsy Oracle
        run: zig test spikes/autopsy_glyph_delta1.zig -O ReleaseFast

      - name: Run Windows Native Flagship Benchmarks (ReleaseFast)
        run: zig build bench -Doptimize=ReleaseFast

  test-and-bench-wasm:
    name: Test & Bench (WebAssembly WASI via Wasmtime)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Compile WASI Test & Flagship Benchmark Binaries
        run: |
          zig test src/root.zig -target wasm32-wasi -O ReleaseFast --test-no-exec -femit-bin=test_root.wasm
          zig test spikes/paint_pipeline.zig -target wasm32-wasi -O ReleaseFast --test-no-exec -femit-bin=test_paint.wasm
          zig test spikes/resize_1cycle.zig -target wasm32-wasi -O ReleaseFast --test-no-exec -femit-bin=test_resize.wasm
          zig build-exe spikes/resize_1cycle.zig -target wasm32-wasi -O ReleaseFast -femit-bin=resize_1cycle.wasm
          zig build-exe spikes/perf_100x_prototype.zig -target wasm32-wasi -O ReleaseFast -femit-bin=perf_100x.wasm
          zig build-exe spikes/alt_architectures_bench.zig -target wasm32-wasi -O ReleaseFast -femit-bin=alt_bench.wasm
          zig build-exe spikes/truetype_real.zig -target wasm32-wasi -O ReleaseFast -femit-bin=truetype_real.wasm

      - name: Execute WASI Tests & Flagship Benchmarks via Wasmtime
        run: |
          wasmtime test_root.wasm
          wasmtime test_paint.wasm
          wasmtime test_resize.wasm
          wasmtime resize_1cycle.wasm
          wasmtime perf_100x.wasm
          wasmtime alt_bench.wasm
          wasmtime truetype_real.wasm

  test-and-bench-android:
    name: Test & Bench (Android ARM64 via QEMU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install QEMU User Static
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt || sudo apt-get install -y qemu-user-static || sudo apt-get install -y qemu-user

      - name: Cross-Compile Android ARM64 Test & Flagship Benchmark Binaries
        run: |
          zig test spikes/paint_pipeline.zig -target aarch64-linux-android -O ReleaseFast --test-no-exec -femit-bin=test_paint_android
          zig test spikes/resize_1cycle.zig -target aarch64-linux-android -O ReleaseFast --test-no-exec -femit-bin=test_resize_android
          zig build-exe spikes/engine_m0.zig -target aarch64-linux-android -O ReleaseFast -femit-bin=engine_android
          zig build-exe spikes/resize_1cycle.zig -target aarch64-linux-android -O ReleaseFast -femit-bin=resize_android
          zig build-exe spikes/perf_100x_prototype.zig -target aarch64-linux-android -O ReleaseFast -femit-bin=perf_android
          zig build-exe spikes/alt_architectures_bench.zig -target aarch64-linux-android -O ReleaseFast -femit-bin=alt_android
          zig build-exe spikes/truetype_real.zig -target aarch64-linux-android -O ReleaseFast -femit-bin=truetype_android

      - name: Execute Android ARM64 via QEMU User Space
        run: |
          QEMU_EXEC=$(which qemu-aarch64-static 2>/dev/null || which qemu-aarch64 2>/dev/null || echo "qemu-aarch64-static")
          $QEMU_EXEC ./test_paint_android
          $QEMU_EXEC ./test_resize_android
          $QEMU_EXEC ./engine_android
          $QEMU_EXEC ./resize_android
          $QEMU_EXEC ./perf_android
          $QEMU_EXEC ./alt_android
          $QEMU_EXEC ./truetype_android

  test-and-bench-freebsd:
    name: Test & Bench (FreeBSD 14 VM via vmactions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Cross-Compile FreeBSD x86_64 Test & Flagship Benchmark Binaries
        run: |
          zig test spikes/paint_pipeline.zig -target x86_64-freebsd -O ReleaseFast --test-no-exec -femit-bin=test_paint_fbsd
          zig test spikes/resize_1cycle.zig -target x86_64-freebsd -O ReleaseFast --test-no-exec -femit-bin=test_resize_fbsd
          zig build-exe spikes/engine_m0.zig -target x86_64-freebsd -O ReleaseFast -femit-bin=engine_fbsd
          zig build-exe spikes/resize_1cycle.zig -target x86_64-freebsd -O ReleaseFast -femit-bin=resize_fbsd
          zig build-exe spikes/perf_100x_prototype.zig -target x86_64-freebsd -O ReleaseFast -femit-bin=perf_fbsd
          zig build-exe spikes/alt_architectures_bench.zig -target x86_64-freebsd -O ReleaseFast -femit-bin=alt_fbsd
          zig build-exe spikes/truetype_real.zig -target x86_64-freebsd -O ReleaseFast -femit-bin=truetype_fbsd

      - name: Run Tests & Flagship Benchmarks in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          run: |
            chmod +x test_paint_fbsd test_resize_fbsd engine_fbsd resize_fbsd perf_fbsd alt_fbsd truetype_fbsd
            ./test_paint_fbsd
            ./test_resize_fbsd
            ./engine_fbsd
            ./resize_fbsd
            ./perf_fbsd
            ./alt_fbsd
            ./truetype_fbsd

  required:
    name: Required Status Gate
    if: always()
    needs:
      - lint-and-format
      - cross-compile-tiers
      - size-budget
      - test-and-bench-linux
      - test-and-bench-macos-ios
      - test-and-bench-windows
      - test-and-bench-wasm
      - test-and-bench-android
      - test-and-bench-freebsd
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Upstream Quality Gates
        run: |
          results='${{ toJSON(needs) }}'
          echo "Evaluating job results: ${results}"
          if echo "${results}" | grep -q '"result": *"failure"' || echo "${results}" | grep -q '"result": *"cancelled"'; then
            echo "ERROR: One or more upstream quality gates failed or were cancelled."
            exit 1
          fi
          echo "All quality gates successfully passed!"
